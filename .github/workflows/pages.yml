name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/artifact-improvement-5fu7z1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the page parses and the fragment round-trips
        run: |
          test -f index.html
          ./build.sh
          diff <(sed -n '/ARTIFACT:START/,/ARTIFACT:END/p' index.html | sed '1d;$d') dist/artifact.html
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const html = readFileSync("index.html", "utf8");
            for (const tag of ["<!doctype html>", "<title>", "manifest.webmanifest", "sw.js"]) {
              if (!html.includes(tag)) throw new Error("index.html is missing " + tag);
            }
            JSON.parse(readFileSync("manifest.webmanifest", "utf8"));
            new Function(readFileSync("sw.js", "utf8"));
            console.log("ok");
          '

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js icon.svg icon-maskable.svg .nojekyll _site/

      # enablement: true で Pages サイト自体もワークフローから作る。
      # 設定画面で Source を切り替えなくても、この push で公開が始まる。
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
